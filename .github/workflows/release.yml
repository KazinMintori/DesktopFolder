name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    environment: release-signing

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import code-signing certificate
        id: certificate
        shell: powershell
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) { throw "Missing CODE_SIGNING_CERTIFICATE_BASE64 secret." }
          if (-not $env:CERTIFICATE_PASSWORD) { throw "Missing CODE_SIGNING_CERTIFICATE_PASSWORD secret." }

          $pfxPath = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation "Cert:\CurrentUser\My")
          Remove-Item -LiteralPath $pfxPath -Force

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $signingCertificate = $imported | Where-Object {
            $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid)
          } | Select-Object -First 1
          if (-not $signingCertificate) { throw "The PFX does not contain a code-signing certificate with a private key." }

          "SIGNING_CERT_THUMBPRINT=$($signingCertificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ($imported.Thumbprint -join "`n") | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "imported-certificates.txt") -Encoding ascii

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Sign and verify
        shell: powershell
        run: |
          .\sign-release.ps1 -Path .\DesktopFolders.exe
          .\verify-release.ps1 -Path .\DesktopFolders.exe -RequireSignature -RequireTimestamp

      - name: Create checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath .\DesktopFolders.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DesktopFolders.exe" | Set-Content -LiteralPath .\DesktopFolders.exe.sha256 -Encoding ascii

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopFolders-signed
          path: |
            DesktopFolders.exe
            DesktopFolders.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "${{ github.ref_name }}" *> $null) {
            gh release upload "${{ github.ref_name }}" DesktopFolders.exe DesktopFolders.exe.sha256 --clobber
          } else {
            gh release create "${{ github.ref_name }}" DesktopFolders.exe DesktopFolders.exe.sha256 --verify-tag --generate-notes --title "DesktopFolders ${{ github.ref_name }}"
          }

      - name: Remove imported certificate
        if: always() && steps.certificate.outcome == 'success'
        shell: powershell
        run: |
          $thumbprintsPath = Join-Path $env:RUNNER_TEMP "imported-certificates.txt"
          if (Test-Path -LiteralPath $thumbprintsPath) {
            Get-Content -LiteralPath $thumbprintsPath | Where-Object { $_ } | ForEach-Object {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$_" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $thumbprintsPath -Force
          }
